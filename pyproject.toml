[project]
name = "xr18-mcp"
version = "0.1.1"
description = "MCP server that lets an AI assistant run a Behringer XR18 mixer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pavel Lazarenko", email = "pavel.lazarenko@gmail.com" }
]
keywords = ["mcp", "behringer", "xr18", "x-air", "mixer", "osc", "live-sound", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Mixers",
]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.2.0",
    "python-osc>=1.10.2",
]

[project.urls]
Homepage = "https://github.com/ramzed/xr18-mcp"
Issues = "https://github.com/ramzed/xr18-mcp/issues"

[project.scripts]
xr18-mcp = "xr18_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["xr18_mcp"]

[tool.coverage.report]
show_missing = true
fail_under = 95
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
